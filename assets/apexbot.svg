<clipPath id="card"><rect width="1200" height="360" rx="22"/></clipPath>

</defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .flow{animation:flow 1.4s linear infinite}
  .blink{animation:blink 1.1s steps(2) infinite}
  .float{animation:float 5s ease-in-out infinite}
  .d1{animation-delay:.6s} .d2{animation-delay:1.2s} .d3{animation-delay:1.8s}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
