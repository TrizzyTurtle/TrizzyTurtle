<title>ApexBot: a company portal for AI agent workspaces. Private repository.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111828"/><stop offset="1" stop-color="#0a0e16"/></linearGradient>
<radialGradient id="g1" cx=".85" cy=".1" r=".8"><stop offset="0" stop-color="#7c8cff" stop-opacity=".26"/><stop offset="1" stop-color="#7c8cff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".05" cy="1" r=".7"><stop offset="0" stop-color="#b58bff" stop-opacity=".16"/><stop offset="1" stop-color="#b58bff" stop-opacity="0"/></radialGradient>
