<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Tristan. I build AI agent tools, automation and full-stack products.">
<title>Tristan. I build AI agent tools, automation and full-stack products.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111828"/><stop offset="1" stop-color="#0a0e16"/></linearGradient>
<radialGradient id="g1" cx=".85" cy=".1" r=".8"><stop offset="0" stop-color="#7c8cff" stop-opacity=".26"/><stop offset="1" stop-color="#7c8cff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".05" cy="1" r=".7"><stop offset="0" stop-color="#35d6c0" stop-opacity=".16"/><stop offset="1" stop-color="#35d6c0" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#35d6c0"/></linearGradient>
<linearGradient id="accv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#35d6c0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>

</defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .flow{animation:flow 1.4s linear infinite}
  .blink{animation:blink 1.1s steps(2) infinite}
  .float{animation:float 5s ease-in-out infinite}
  .d1{animation-delay:.6s} .d2{animation-delay:1.2s} .d3{animation-delay:1.8s}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#grid)"/>
<rect width="1200" height="300" fill="url(#g1)"/>
<rect width="1200" height="300" fill="url(#g2)"/>
<text x="64" y="92" class="m" font-size="15" font-weight="600" fill="#6f7b90" text-anchor="start" letter-spacing='3'>HELLO, I&#x27;M</text><text x="58" y="178" class="s" font-size="92" font-weight="800" fill="url(#acc)" letter-spacing="-3">Tristan</text><text x="64" y="228" class="s" font-size="26" font-weight="400" fill="#a3afc2" text-anchor="start" >I build AI agent tools, automation</text><text x="64" y="262" class="s" font-size="26" font-weight="400" fill="#a3afc2" text-anchor="start" >and full-stack products.</text><rect x="716" y="38" width="428" height="224" rx="14" fill="#0c111b" stroke="#263045" stroke-width="1.5"/><circle cx="736" cy="56" r="4.6" fill="#ff5f57" opacity=".85"/><circle cx="752" cy="56" r="4.6" fill="#febc2e" opacity=".85"/><circle cx="768" cy="56" r="4.6" fill="#28c840" opacity=".85"/><line x1="716" y1="74" x2="1144" y2="74" stroke="#263045"/><text x="738" y="104" class="m" font-size="16" xml:space="preserve"><tspan fill="#7c8cff">$ </tspan><tspan fill="#f2f5f9">ls work/</tspan></text><text x="738" y="131" class="m" font-size="16" fill="#35d6c0" xml:space="preserve">apexbot/   apexsocial/   crew/</text><text x="738" y="158" class="m" font-size="16" fill="#35d6c0" xml:space="preserve">mediaflow/   pdf-pro/   ...</text><text x="738" y="185" class="m" font-size="16" xml:space="preserve"><tspan fill="#7c8cff">$ </tspan><tspan fill="#f2f5f9">cat stack.txt</tspan></text><text x="738" y="212" class="m" font-size="16" fill="#c9d3e2" xml:space="preserve">TypeScript  Python  Swift  C++</text><text x="738" y="239" class="m" font-size="16" fill="#7c8cff">$</text><rect class="blink" x="758" y="225" width="9" height="17" fill="#f2f5f9"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="21.25" fill="none" stroke="#2c3649" stroke-width="1.5"/>
</svg>
