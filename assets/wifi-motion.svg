<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372" role="img" aria-label="Wi-Fi Motion Detector: senses movement from Wi-Fi signal changes. Public repository.">
<title>Wi-Fi Motion Detector: senses movement from Wi-Fi signal changes. Public repository.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111828"/><stop offset="1" stop-color="#0a0e16"/></linearGradient>
<radialGradient id="g1" cx=".85" cy=".1" r=".8"><stop offset="0" stop-color="#4ea8ff" stop-opacity=".26"/><stop offset="1" stop-color="#4ea8ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".05" cy="1" r=".7"><stop offset="0" stop-color="#ff6fae" stop-opacity=".16"/><stop offset="1" stop-color="#ff6fae" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ea8ff"/><stop offset="1" stop-color="#ff6fae"/></linearGradient>
<linearGradient id="accv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ea8ff"/><stop offset="1" stop-color="#ff6fae"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<clipPath id="card"><rect width="600" height="372" rx="22"/></clipPath>

</defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .flow{animation:flow 1.4s linear infinite}
  .blink{animation:blink 1.1s steps(2) infinite}
  .float{animation:float 5s ease-in-out infinite}
  .d1{animation-delay:.6s} .d2{animation-delay:1.2s} .d3{animation-delay:1.8s}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<g clip-path="url(#card)">
<rect width="600" height="372" fill="url(#bg)"/>
<rect width="600" height="372" fill="url(#grid)"/>
<rect width="600" height="372" fill="url(#g1)"/>
<rect width="600" height="372" fill="url(#g2)"/>
