inecap="round"/><circle class="pulse" cx="407.1" cy="146" r="4.5" fill="#ff6fae"/></g><text x="27" y="258" class="s" font-size="31" font-weight="700" fill="#f2f5f9" text-anchor="start" letter-spacing='-.5'>Wi-Fi Motion Detector</text><g transform="translate(439,235)"><rect width="133" height="28" rx="14" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".35"/><g transform="translate(13,6)"><rect x="0" y="7" width="13" height="9.5" rx="2.2" fill="#3ddc84"/><path d="M3 7V4.6a3.5 3.5 0 0 1 6.6-1.6" fill="none" stroke="#3ddc84" stroke-width="1.9" stroke-linecap="round"/></g><text x="34" y="18.5" class="m" font-size="12" font-weight="600" fill="#3ddc84" text-anchor="start" letter-spacing='.8'>PUBLIC REPO</text></g><text x="28" y="289" class="s" font-size="17" font-weight="400" fill="#a3afc2" text-anchor="start" >Senses movement from Wi-Fi signal changes.</text><rect x="28" y="312" width="72" height="27" rx="13.5" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/><text x="64.0" y="330.05" class="m" font-size="13" font-weight="400" fill="#c9d3e2" text-anchor="middle" >Python</text><rect x="108" y="312" width="64" height="27" rx="13.5" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/><text x="140.0" y="330.05" class="m" font-size="13" font-weight="400" fill="#c9d3e2" text-anchor="middle" >macOS</text><rect x="180" y="312" width="80" height="27" rx="13.5" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/><text x="220.0" y="330.05" class="m" font-size="13" font-weight="400" fill="#c9d3e2" text-anchor="middle" >Windows</text><rect x="268" y="312" width="64" height="27" rx="13.5" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/><text x="300.0" y="330.05" class="m" font-size="13" font-weight="400" fill="#c9d3e2" text-anchor="middle" >Linux</text>
</g>
